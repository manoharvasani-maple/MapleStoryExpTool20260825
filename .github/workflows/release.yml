name: Build and publish Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release v1.1.3]')
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run economy tracker tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v

      - name: Build Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name MapleStoryExpTool --icon icon.ico --add-data "resources;resources" main.py

          $app = "dist\MapleStoryExpTool"
          Remove-Item -LiteralPath "$app\_internal\cv2\opencv_videoio_ffmpeg500_64.dll" -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "$app\_internal\PySide6\opengl32sw.dll" -ErrorAction SilentlyContinue

          $rootOpenBlas = "$app\_internal\libscipy_openblas64_-327b2e0bcffce2882e0dc04cdeb4eaa6.dll"
          $numpyOpenBlas = "$app\_internal\numpy.libs\libscipy_openblas64_-327b2e0bcffce2882e0dc04cdeb4eaa6.dll"
          if ((Test-Path -LiteralPath $rootOpenBlas) -and (Test-Path -LiteralPath $numpyOpenBlas)) {
            if ((Get-FileHash -LiteralPath $rootOpenBlas).Hash -eq (Get-FileHash -LiteralPath $numpyOpenBlas).Hash) {
              Remove-Item -LiteralPath $rootOpenBlas
            }
          }

          @"
          MapleStoryExpTool v1.1.3

          使用方式：
          1. 完整解壓縮此 ZIP。
          2. 雙擊 MapleStoryExpTool.exe。
          3. HP 藥水放在 Del，MP 藥水放在 Ins。
          4. 開啟背包後即可讀取楓幣；背包可放在遊戲視窗內任意位置。
          5. 輸入藥水單價後按一次重置，開始新的統計。

          統計說明：
          - 楓幣淨變化以按下重置後的第一筆正確讀值為基準，可為負數。
          - 撿到同種藥水會抵銷藥水消耗，因此藥水消耗也可為負數。
          - 單次藥水數量跳動超過 10 瓶時，會視為 OCR 異常並重新建立基準。

          Windows SmartScreen 可能因程式沒有付費數位簽章而顯示提示。
          "@ | Set-Content -LiteralPath "$app\README.txt" -Encoding utf8

          Compress-Archive -LiteralPath $app -DestinationPath "MapleStoryExpTool-1.1.3-Windows-EXE.zip" -CompressionLevel Optimal

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @"
          ## Windows 版下載方式

          請從 Assets 下載 `MapleStoryExpTool-1.1.3-Windows-EXE.zip`。完整解壓縮後，雙擊 `MapleStoryExpTool.exe`。

          ## 1.1.3 修正

          - 楓幣改為相對重置基準的淨變化，避免 OCR 暫時誤讀後恢復造成重複累加
          - 撿到同種藥水時會抵銷藥水消耗，結果允許為負數
          - 過濾單次超過 10 瓶的藥水 OCR 異常跳動
          - 藥水成本與扣除藥水後淨收益會依淨消耗重新計算

          ## 注意事項

          - 更新後請按一次重置，舊版已累積的錯誤數字不會自動修復
          - HP 藥水需放在 `Del`
          - MP 藥水需放在 `Ins`
          - 背包開啟時才能讀取楓幣，背包位置可移動
          - 程式未購買數位簽章，Windows 可能顯示 SmartScreen 提示
          "@ | Set-Content -LiteralPath "release-notes.md" -Encoding utf8

          gh release create v1.1.3 "MapleStoryExpTool-1.1.3-Windows-EXE.zip" --target main --title "MapleStoryExpTool v1.1.3" --notes-file "release-notes.md"

