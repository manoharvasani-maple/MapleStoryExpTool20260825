name: Build and publish Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run economy tracker tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v

      - name: Build Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name MapleStoryExpTool --icon icon.ico --add-data "resources;resources" main.py

          $app = "dist\MapleStoryExpTool"
          Remove-Item -LiteralPath "$app\_internal\cv2\opencv_videoio_ffmpeg500_64.dll" -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "$app\_internal\PySide6\opengl32sw.dll" -ErrorAction SilentlyContinue

          $rootOpenBlas = "$app\_internal\libscipy_openblas64_-327b2e0bcffce2882e0dc04cdeb4eaa6.dll"
          $numpyOpenBlas = "$app\_internal\numpy.libs\libscipy_openblas64_-327b2e0bcffce2882e0dc04cdeb4eaa6.dll"
          if ((Test-Path -LiteralPath $rootOpenBlas) -and (Test-Path -LiteralPath $numpyOpenBlas)) {
            if ((Get-FileHash -LiteralPath $rootOpenBlas).Hash -eq (Get-FileHash -LiteralPath $numpyOpenBlas).Hash) {
              Remove-Item -LiteralPath $rootOpenBlas
            }
          }

          @"
          MapleStoryExpTool v1.1.9

          使用方式：
          1. 完整解壓縮此 ZIP。
          2. 雙擊 MapleStoryExpTool.exe。
          3. HP 藥水放在 Del，MP 藥水放在 Ins。
          4. 開啟背包後即可讀取楓幣；背包可放在遊戲視窗內任意位置。
          5. 輸入藥水單價後按一次重置，等待起始藥水數量出現。
          6. 若起始數量錯誤，可按「修正起始」手動更正。
          7. 練功結束時按「偵測結算」，或使用「手動結算」輸入結束數量。
          8. 需要暫停統計時按「時間停止」，再次按下「時間繼續」即可接續。

          統計說明：
          - 楓幣淨變化以按下重置後的第一筆正確讀值為基準，可為負數。
          - 藥水消耗只比較重置後起始快照與結算快照。
          - 練功途中 OCR 讀值不會改寫藥水消耗。
          - 撿到同種藥水會抵銷藥水消耗，因此結果也可為負數。

          診斷日誌：
          - 錯誤紀錄位於 %APPDATA%\ExpTracker\error.log。
          - 可從設定頁按「開啟錯誤紀錄資料夾」。
          - 日誌不會保存遊戲截圖，單一檔案最大約 1 MB 並保留 3 份備份。

          Windows SmartScreen 可能因程式沒有付費數位簽章而顯示提示。
          "@ | Set-Content -LiteralPath "$app\README.txt" -Encoding utf8

          Compress-Archive -LiteralPath $app -DestinationPath "MapleStoryExpTool-1.1.9-Windows-EXE.zip" -CompressionLevel Optimal

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @"
          ## Windows 版下載方式

          請從 Assets 下載 `MapleStoryExpTool-1.1.9-Windows-EXE.zip`。完整解壓縮後，雙擊 `MapleStoryExpTool.exe`。

          此版本為公開測試版，主要用來收集不同電腦與遊戲畫面下的 HP／MP
          快捷欄辨識結果。若遇到問題，請一併提供 `%APPDATA%\ExpTracker\error.log`。

          ## 1.1.9 時間暫停

          - 在重置旁新增同配色的「時間停止」按鈕
          - 暫停時凍結持續時間與經驗速率，楓幣及藥水辨識仍會繼續
          - 再次按「時間繼續」即可接續，暫停期間不列入統計
          - 按下重置會解除暫停並開始新的統計

          ## 1.1.8 起始數量修正

          - 新增「修正起始」按鈕，可手動覆寫自動 OCR 的 HP／MP 起始數量
          - 修正起始數量後會清除舊結算結果，避免混用不同基準
          - 處理快捷欄圖案或邊緣被誤認成額外數字的情況，例如 `702 → 7022`

          ## 1.1.7 快照式藥水結算

          - 重置後自動保存 HP／MP 起始數量
          - 練功途中不再依每一次 OCR 變化累加藥水消耗
          - 新增「偵測結算」，用第二次偵測數量計算總消耗
          - 新增「手動結算」，辨識失敗時可自行輸入結束數量
          - 藥水消耗、成本與淨收益只依起始／結束兩次快照計算

          ## 1.1.6 修正

          - 白水改用多個文字裁切範圍交叉辨識，避免固定裁切漏掉數字筆畫
          - OCR 候選平票且畫面已變化時，不再永遠保留舊數字
          - 支援 `1000 → 999` 等正常位數變化
          - 按下重置時同步清除楓幣與 HP／MP OCR 快取
          - 錯誤日誌新增藥水基準、接受變化及拒絕跳動紀錄

          ## 1.1.5 修正

          - 校正 HP／MP 快捷欄數字裁切範圍，完整保留四位數字緣
          - 使用多種放大方式交叉辨識快捷欄像素字體
          - 修正藍水使用 1 瓶可能跳成 10 瓶
          - 修正白水 1510 降到 1508 可能顯示 -8
          - 藥水統計改為重置基準減去目前確認數量，OCR 異常不再改寫基準

          ## 1.1.4 新增

          - 自動寫入 `%APPDATA%\ExpTracker\error.log`
          - 記錄畫面擷取例外、遊戲視窗狀態、模板比對分數與 OCR 例外
          - 設定頁新增「開啟錯誤紀錄資料夾」按鈕
          - 日誌單檔上限約 1 MB，保留最多 3 份備份
          - 日誌不保存遊戲截圖

          ## 既有修正

          - 楓幣改為相對重置基準的淨變化，避免 OCR 暫時誤讀後恢復造成重複累加
          - 撿到同種藥水時會抵銷藥水消耗，結果允許為負數
          - 過濾藥水 OCR 異常跳動
          - 藥水成本與扣除藥水後淨收益會依淨消耗重新計算

          ## 注意事項

          - 更新後請按一次重置，舊版已累積的錯誤數字不會自動修復
          - HP 藥水需放在 `Del`
          - MP 藥水需放在 `Ins`
          - 背包開啟時才能讀取楓幣，背包位置可移動
          - 程式未購買數位簽章，Windows 可能顯示 SmartScreen 提示
          "@ | Set-Content -LiteralPath "release-notes.md" -Encoding utf8

          gh release create v1.1.9 "MapleStoryExpTool-1.1.9-Windows-EXE.zip" --target main --prerelease --title "MapleStoryExpTool v1.1.9 測試版" --notes-file "release-notes.md"
